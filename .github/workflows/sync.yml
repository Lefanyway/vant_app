# Keeps Supabase fresh with no computer on: one PandaScore sync pass every hour.
# Needs repository secrets PANDASCORE_API_TOKEN, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY and SUPABASE_INGEST_KEY.
name: Sync PandaScore

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @workspace/api-server...
      - run: pnpm --filter @workspace/api-server run sync:once
        env:
          PANDASCORE_API_TOKEN: ${{ secrets.PANDASCORE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_INGEST_KEY: ${{ secrets.SUPABASE_INGEST_KEY }}
